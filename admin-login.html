<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login | ExamPro</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-header">
      <a href="index.html" class="brand-logo">
        <i class="fa-solid fa-user-shield" style="color:var(--primary);"></i>
        <span>Exam<span style="color:var(--primary);">Pro</span> Admin</span>
      </a>
      <h2 class="auth-title">Administrator Portal</h2>
      <p class="auth-subtitle">Sign in to manage exams, question banks, and student scores</p>
    </div>

    <!-- Demo Credentials Notice -->
    <div class="security-note" style="margin-bottom: 1.5rem; background:var(--primary-light); border-color:var(--primary-border); color:var(--primary-dark);">
      <i class="fa-solid fa-key"></i>
      <div>
        <strong>Default Admin Credentials:</strong><br>
        Email: <code>admin@exampro.com</code> | Password: <code>admin123</code>
      </div>
    </div>

    <form id="adminLoginForm">
      <div class="form-group">
        <label for="adminEmail" class="form-label">Administrator Email</label>
        <input type="email" id="adminEmail" class="form-control" value="admin@exampro.com" required>
      </div>

      <div class="form-group">
        <label for="adminPassword" class="form-label">Password</label>
        <input type="password" id="adminPassword" class="form-control" value="admin123" required>
      </div>

      <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-top:0.5rem;">
        <i class="fa-solid fa-lock-open"></i> Login to Admin Panel
      </button>
    </form>

    <div style="text-align:center; margin-top:1.5rem; font-size:0.9rem;">
      <a href="login.html"><i class="fa-solid fa-arrow-left"></i> Switch to Student Login</a>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
