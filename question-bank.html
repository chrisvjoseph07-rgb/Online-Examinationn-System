<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Question Bank Management | ExamPro</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

  <div class="admin-wrapper">
    <!-- Admin Sidebar -->
    <aside class="admin-sidebar" id="adminSidebar">
      <a href="admin-dashboard.html" class="brand-logo">
        <i class="fa-solid fa-user-shield"></i>
        <span>ExamPro Admin</span>
      </a>

      <ul class="admin-menu">
        <li class="admin-menu-item"><a href="admin-dashboard.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a></li>
        <li class="admin-menu-item active"><a href="question-bank.html"><i class="fa-solid fa-database"></i> Question Bank</a></li>
        <li class="admin-menu-item"><a href="create-exam.html"><i class="fa-solid fa-plus-circle"></i> Create Exam</a></li>
        <li class="admin-menu-item"><a href="manage-exams.html"><i class="fa-solid fa-list-check"></i> Manage Exams</a></li>
        <li class="admin-menu-item"><a href="students.html"><i class="fa-solid fa-users"></i> Students</a></li>
        <li class="admin-menu-item"><a href="results.html"><i class="fa-solid fa-square-poll-vertical"></i> Results</a></li>
        <li class="admin-menu-item" style="margin-top:auto;">
          <a href="#" onclick="logoutUser(); return false;" style="color:#ef4444;"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
        </li>
      </ul>
    </aside>

    <main class="admin-main">
      <header class="admin-topbar">
        <div style="display:flex; align-items:center; gap:1rem;">
          <button class="btn btn-sm btn-secondary" onclick="document.getElementById('adminSidebar').classList.toggle('active')"><i class="fa-solid fa-bars"></i></button>
          <h2>Question Bank Repository</h2>
        </div>

        <button id="addQuestionBtn" class="btn btn-primary"><i class="fa-solid fa-plus"></i> Add New Question</button>
      </header>

      <div class="admin-body" id="questionBankContainer">
        
        <!-- Search & Filter Controls -->
        <div class="card" style="margin-bottom:1.5rem; padding:1.25rem;">
          <div class="form-row">
            <div style="flex:2;">
              <input type="text" id="qbSearchInput" class="form-control" placeholder="Search questions or keywords...">
            </div>
            <div>
              <select id="qbSubjectFilter" class="form-control">
                <option value="all">All Subjects</option>
                <option value="Web Development">Web Development</option>
                <option value="Python Programming">Python Programming</option>
                <option value="Data Structures">Data Structures</option>
                <option value="Computer Networks">Computer Networks</option>
                <option value="General Aptitude">General Aptitude</option>
              </select>
            </div>
            <div>
              <select id="qbDiffFilter" class="form-control">
                <option value="all">All Difficulties</option>
                <option value="Easy">Easy</option>
                <option value="Medium">Medium</option>
                <option value="Hard">Hard</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Questions Table -->
        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th style="width:40px;">#</th>
                <th>Question Text</th>
                <th>Subject</th>
                <th>Type</th>
                <th>Marks</th>
                <th>Difficulty</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="qbTableBody">
              <!-- Rendered by admin.js -->
            </tbody>
          </table>
        </div>

      </div>
    </main>
  </div>

  <script src="js/app.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
