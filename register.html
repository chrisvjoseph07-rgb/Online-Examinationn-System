<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration | ExamPro</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="auth-page">

  <div class="auth-card" style="max-width:540px;">
    <div class="auth-header">
      <a href="index.html" class="brand-logo">
        <i class="fa-solid fa-graduation-cap"></i>
        <span>Exam<span style="color:var(--primary);">Pro</span></span>
      </a>
      <h2 class="auth-title">Create an Account</h2>
      <p class="auth-subtitle">Register to take online exams and access performance reports</p>
    </div>

    <form id="registerForm">
      <div class="form-group">
        <label for="fullName" class="form-label">Full Name</label>
        <input type="text" id="fullName" class="form-control" placeholder="John Doe" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="john@example.com" required>
        </div>

        <div class="form-group">
          <label for="phone" class="form-label">Phone Number</label>
          <input type="tel" id="phone" class="form-control" placeholder="+1 555 019 2831" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Min 6 characters" required>
        </div>

        <div class="form-group">
          <label for="confirmPassword" class="form-label">Confirm Password</label>
          <input type="password" id="confirmPassword" class="form-control" placeholder="Repeat password" required>
        </div>
      </div>

      <div class="form-group">
        <label for="role" class="form-label">I am registering as a:</label>
        <select id="role" class="form-control">
          <option value="student">Student</option>
          <option value="applicant">Job Applicant / Candidate</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-top:0.5rem;">
        <i class="fa-solid fa-user-check"></i> Register Account
      </button>
    </form>

    <div style="text-align:center; margin-top:1.5rem; font-size:0.9rem; color:var(--text-secondary);">
      Already have an account? <a href="login.html" style="font-weight:600;">Log In</a>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
