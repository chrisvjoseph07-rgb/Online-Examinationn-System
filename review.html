<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Answer Review | ExamPro</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

  <header class="navbar no-print">
    <div class="container">
      <a href="student-dashboard.html" class="brand-logo">
        <i class="fa-solid fa-graduation-cap"></i>
        <span>Exam<span style="color:var(--primary);">Pro</span></span>
      </a>
      <div class="nav-actions">
        <div id="userNavBadge"></div>
      </div>
    </div>
  </header>

  <main class="main-content" id="reviewContainer" style="padding: 2.5rem 0;">
    <div class="container" style="max-width:900px;">
      
      <div class="card" style="margin-bottom:2rem; padding:1.5rem 2rem;">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem;">
          <div>
            <h2 id="reviewExamTitle">Exam Answer Review</h2>
            <p>Candidate: <strong id="reviewStudentName">Candidate Name</strong></p>
          </div>
          <div class="no-print">
            <a href="student-dashboard.html" class="btn btn-secondary btn-sm"><i class="fa-solid fa-house"></i> Dashboard</a>
          </div>
        </div>
      </div>

      <!-- Question Review Cards Container -->
      <div id="reviewQuestionsList">
        <!-- Dynamically rendered question review list -->
      </div>

    </div>
  </main>

  <script src="js/app.js"></script>
  <script src="js/exam.js"></script>
</body>
</html>
