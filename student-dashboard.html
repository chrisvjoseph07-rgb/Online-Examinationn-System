<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard | ExamPro</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container">
      <a href="student-dashboard.html" class="brand-logo">
        <i class="fa-solid fa-graduation-cap"></i>
        <span>Exam<span style="color:var(--primary);">Pro</span></span>
      </a>

      <nav>
        <ul class="nav-links" id="primaryNav">
          <li><a href="student-dashboard.html" class="nav-link active">Dashboard</a></li>
          <li><a href="#availableExamsSection" class="nav-link">Available Exams</a></li>
          <li><a href="#recentResultsSection" class="nav-link">My Results</a></li>
        </ul>
      </nav>

      <div class="nav-actions">
        <div id="userNavBadge"></div>
      </div>
    </div>
  </header>

  <!-- Candidate Profile Dashboard Header -->
  <div class="dashboard-header codetantra-dash-header">
    <div class="container">
      <div class="student-profile-banner" id="studentProfileBanner">
        <!-- Rendered dynamically via JS with photo & ID -->
      </div>
    </div>
  </div>

  <main class="main-content">
    <div class="container">
      
      <!-- Active Exam In Progress Banner -->
      <div id="activeExamBannerContainer"></div>

      <!-- Metrics Summary Cards -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon primary"><i class="fa-solid fa-file-signature"></i></div>
          <div>
            <div class="stat-value" id="dashTotalAttempted">0</div>
            <div class="stat-label">Exams Completed</div>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon success"><i class="fa-solid fa-square-check"></i></div>
          <div>
            <div class="stat-value" id="dashPassedExams">0</div>
            <div class="stat-label">Passed Exams</div>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon warning"><i class="fa-solid fa-chart-line"></i></div>
          <div>
            <div class="stat-value" id="dashAvgScore">0%</div>
            <div class="stat-label">Average Score</div>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon info"><i class="fa-solid fa-list-ol"></i></div>
          <div>
            <div class="stat-value" id="dashAvailableCount">0</div>
            <div class="stat-label">Available Exams</div>
          </div>
        </div>
      </div>

      <!-- Search & Filter Bar -->
      <div class="card" style="margin-bottom:2rem; padding:1.25rem;">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem;">
          <div style="flex:1; min-width:260px;">
            <input type="text" id="examSearchInput" class="form-control" placeholder="Search exams by name or subject...">
          </div>
          <div style="width:200px;">
            <select id="examSubjectSelect" class="form-control">
              <option value="all">All Subjects</option>
              <option value="Web Development">Web Development</option>
              <option value="Python Programming">Python Programming</option>
              <option value="Data Structures">Data Structures</option>
              <option value="Computer Networks">Computer Networks</option>
              <option value="General Aptitude">General Aptitude</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Available Exams Section -->
      <section id="availableExamsSection" style="margin-bottom:3rem;">
        <h2 style="margin-bottom:1.5rem;"><i class="fa-solid fa-folder-open" style="color:var(--primary);"></i> Available Exams</h2>
        
        <div class="exam-grid" id="studentExamGrid">
          <!-- Dynamically Rendered by JS -->
        </div>
      </section>

      <!-- Recent Results Section -->
      <section id="recentResultsSection" style="margin-bottom:3rem;">
        <h2 style="margin-bottom:1.5rem;"><i class="fa-solid fa-clock-rotate-left" style="color:var(--primary);"></i> Recent Results & Performance History</h2>
        
        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>Exam Name</th>
                <th>Score</th>
                <th>Percentage</th>
                <th>Status</th>
                <th>Date Taken</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="studentResultsTableBody">
              <!-- Dynamically Rendered by JS -->
            </tbody>
          </table>
        </div>
      </section>

    </div>
  </main>

  <footer class="footer">
    <div class="container" style="text-align:center;">
      <p>&copy; 2026 ExamPro Online Examination System.</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/exam.js"></script>
  <script>
    let dashTimerInterval = null;

    document.addEventListener('DOMContentLoaded', () => {
      const user = requireAuth(['student', 'applicant']);
      if (!user) return;

      const rollNo = user.studentId || user.rollNo || '21BCS0142';
      const dept = user.department || 'Computer Science & Eng (CSE)';
      const avatarSrc = user.avatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(user.name)}&background=2563eb&color=fff`;

      const bannerEl = document.getElementById('studentProfileBanner');
      if (bannerEl) {
        bannerEl.innerHTML = `
          <div class="dash-candidate-card">
            <div class="dash-avatar-wrapper">
              <img src="${avatarSrc}" alt="${user.name}" class="dash-avatar-img" onerror="this.onerror=null; this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(user.name)}&background=2563eb&color=fff';">
              <span class="proctor-active-dot" title="Webcam Proctoring Active"></span>
            </div>
            <div class="dash-candidate-details">
              <div class="candidate-header-line">
                <h2>Welcome Back, ${escapeHtml(user.name)}!</h2>
                <span class="badge badge-success"><i class="fa-solid fa-shield-check"></i> Proctored & Verified</span>
              </div>
              <div class="candidate-sub-line">
                <span class="info-pill"><i class="fa-solid fa-id-card"></i> <strong>Roll No:</strong> ${escapeHtml(rollNo)}</span>
                <span class="info-pill"><i class="fa-solid fa-graduation-cap"></i> ${escapeHtml(dept)}</span>
                <span class="info-pill"><i class="fa-solid fa-calendar"></i> Batch: ${escapeHtml(user.batch || '2021-2025')}</span>
              </div>
            </div>
          </div>
        `;
      }

      renderStudentDashboard();
    });

    function renderStudentDashboard() {
      const user = getCurrentUser();
      if (!user) return;

      const exams = ExamProDB.get(STORAGE_KEYS.EXAMS).filter(e => e.active);
      const results = ExamProDB.get(STORAGE_KEYS.RESULTS).filter(r => r.studentId === user.id);

      // Render Active Exam Banner & Live Countdown
      renderActiveExamBanner(user);

      // Metrics calculation
      const totalAttempted = results.length;
      const passedCount = results.filter(r => r.passed).length;
      const avgScore = totalAttempted > 0
        ? Math.round(results.reduce((acc, r) => acc + r.percentage, 0) / totalAttempted)
        : 0;

      document.getElementById('dashTotalAttempted').innerText = totalAttempted;
      document.getElementById('dashPassedExams').innerText = passedCount;
      document.getElementById('dashAvgScore').innerText = `${avgScore}%`;
      document.getElementById('dashAvailableCount').innerText = exams.length;

      // Filter logic for available exams
      const searchInput = document.getElementById('examSearchInput');
      const subjectSelect = document.getElementById('examSubjectSelect');
      const grid = document.getElementById('studentExamGrid');

      const filterExams = () => {
        const activeState = getActiveExamState(user.id);
        const term = searchInput.value.toLowerCase();
        const subj = subjectSelect.value;

        const filtered = exams.filter(e => {
          const matchSearch = e.title.toLowerCase().includes(term) || e.subject.toLowerCase().includes(term);
          const matchSubj = (subj === 'all') || (e.subject === subj);
          return matchSearch && matchSubj;
        });

        grid.innerHTML = '';

        if (filtered.length === 0) {
          grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:3rem; background:white; border-radius:var(--radius-lg);">No active exams found matching search criteria.</div>`;
          return;
        }

        filtered.forEach(ex => {
          const isExamActive = activeState && activeState.examId === ex.id;
          const timeLeftDisplay = isExamActive
            ? `<div class="exam-meta-item" style="color:var(--danger); font-weight:700;"><i class="fa-solid fa-stopwatch"></i> ${formatTimeLeft(activeState.timeRemainingSeconds)} Left</div>`
            : `<div class="exam-meta-item"><i class="fa-regular fa-clock"></i> ${ex.durationMinutes} Mins</div>`;

          const card = document.createElement('div');
          card.className = `exam-card ${isExamActive ? 'active-exam-card' : ''}`;
          card.innerHTML = `
            <div class="exam-card-body">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.5rem;">
                <span class="badge badge-primary">${escapeHtml(ex.subject)}</span>
                ${isExamActive ? '<span class="badge badge-warning" style="animation: pulse 1.5s infinite;"><i class="fa-solid fa-clock"></i> In Progress</span>' : ''}
              </div>
              <h3 style="margin: 0.5rem 0;">${escapeHtml(ex.title)}</h3>
              <p style="font-size:0.85rem; height:40px; overflow:hidden;">${escapeHtml(ex.description)}</p>
              <div class="exam-meta-grid">
                ${timeLeftDisplay}
                <div class="exam-meta-item"><i class="fa-solid fa-list-check"></i> ${ex.questionIds.length} Questions</div>
                <div class="exam-meta-item"><i class="fa-solid fa-star"></i> ${ex.totalMarks} Marks</div>
                <div class="exam-meta-item"><i class="fa-solid fa-percent"></i> ${ex.passingPercentage}% Pass</div>
              </div>
              ${isExamActive 
                ? `<a href="exam.html?id=${ex.id}" class="btn btn-warning btn-full" style="font-weight:700;"><i class="fa-solid fa-circle-play"></i> Resume Exam</a>`
                : `<a href="instructions.html?id=${ex.id}" class="btn btn-primary btn-full"><i class="fa-solid fa-play"></i> Start Exam</a>`
              }
            </div>
          `;
          grid.appendChild(card);
        });
      };

      searchInput.oninput = filterExams;
      subjectSelect.onchange = filterExams;
      filterExams();

      // Render Results Table
      const resultsBody = document.getElementById('studentResultsTableBody');
      resultsBody.innerHTML = '';

      if (results.length === 0) {
        resultsBody.innerHTML = `<tr><td colspan="6" style="text-align:center;">No completed exam results yet. Take an exam above to see your scores!</td></tr>`;
      } else {
        [...results].reverse().forEach(r => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td><strong>${escapeHtml(r.examTitle)}</strong></td>
            <td>${r.score} / ${r.totalPossibleMarks}</td>
            <td><strong>${r.percentage}%</strong></td>
            <td>
              <span class="badge ${r.passed ? 'badge-success' : 'badge-danger'}">
                ${r.passed ? 'PASSED' : 'FAILED'}
              </span>
            </td>
            <td>${new Date(r.completedAt).toLocaleDateString()}</td>
            <td>
              <a href="review.html?resId=${r.id}" class="btn btn-sm btn-secondary"><i class="fa-solid fa-eye"></i> Review Answers</a>
            </td>
          `;
          resultsBody.appendChild(row);
        });
      }
    }

    function renderActiveExamBanner(user) {
      if (dashTimerInterval) clearInterval(dashTimerInterval);
      const container = document.getElementById('activeExamBannerContainer');
      if (!container) return;

      const activeState = getActiveExamState(user.id);
      if (!activeState) {
        container.innerHTML = '';
        return;
      }

      const exams = ExamProDB.get(STORAGE_KEYS.EXAMS);
      const activeExam = exams.find(e => e.id === activeState.examId);
      const examTitle = activeExam ? activeExam.title : 'Active Exam';

      const updateBannerUI = () => {
        const currentState = getActiveExamState(user.id);
        if (!currentState || currentState.timeRemainingSeconds <= 0) {
          if (currentState) {
            showToast('Exam time expired! Auto-submitting exam...', 'warning');
            autoSubmitActiveExamState(currentState);
          }
          clearInterval(dashTimerInterval);
          container.innerHTML = '';
          renderStudentDashboard();
          return;
        }

        const answeredCount = Object.keys(currentState.userAnswers || {}).filter(k => currentState.userAnswers[k] !== '' && currentState.userAnswers[k] !== undefined).length;
        const totalQuestions = (currentState.questions || []).length;
        const timeLeftStr = formatTimeLeft(currentState.timeRemainingSeconds);
        const isWarning = currentState.timeRemainingSeconds <= 300;

        container.innerHTML = `
          <div class="card" style="margin-bottom:2rem; border-left:5px solid var(--primary); background:linear-gradient(135deg, #ffffff 0%, #f8fafc 100%); padding:1.5rem; box-shadow:var(--shadow-md);">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1.25rem;">
              <div>
                <div style="display:flex; align-items:center; gap:0.5rem; margin-bottom:0.4rem;">
                  <span class="badge badge-warning" style="animation: pulse 1.5s infinite;"><i class="fa-solid fa-spinner fa-spin"></i> EXAM IN PROGRESS</span>
                  <span class="badge badge-primary">${escapeHtml(activeExam ? activeExam.subject : 'Active')}</span>
                </div>
                <h2 style="margin:0; font-size:1.4rem;">${escapeHtml(examTitle)}</h2>
                <p style="margin-top:0.35rem; color:var(--text-secondary); font-size:0.9rem;">
                  Questions Answered: <strong>${answeredCount} / ${totalQuestions}</strong>
                </p>
              </div>
              
              <div style="display:flex; align-items:center; gap:1.5rem; flex-wrap:wrap;">
                <div style="text-align:right; min-width:140px;">
                  <div style="font-size:0.75rem; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px;">Time Remaining</div>
                  <div style="font-size:1.8rem; font-weight:800; font-family:monospace; color:${isWarning ? 'var(--danger)' : 'var(--primary)'}; display:flex; align-items:center; gap:0.4rem; justify-content:flex-end;">
                    <i class="fa-solid fa-stopwatch ${isWarning ? 'fa-beat' : ''}"></i> ${timeLeftStr}
                  </div>
                </div>
                
                <a href="exam.html?id=${activeState.examId}" class="btn btn-primary btn-lg" style="box-shadow:var(--shadow-md); font-weight:700; padding:0.75rem 1.5rem;">
                  <i class="fa-solid fa-circle-play"></i> Resume Exam
                </a>
              </div>
            </div>
          </div>
        `;

        // Update time left displays on any active exam meta items in available grid
        const activeMetaItems = document.querySelectorAll('.active-exam-card .fa-stopwatch');
        activeMetaItems.forEach(icon => {
          if (icon.parentElement) {
            icon.parentElement.innerHTML = `<i class="fa-solid fa-stopwatch"></i> ${timeLeftStr} Left`;
          }
        });
      };

      updateBannerUI();
      dashTimerInterval = setInterval(updateBannerUI, 1000);
    }

    function escapeHtml(text) {
      if (!text) return '';
      return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
